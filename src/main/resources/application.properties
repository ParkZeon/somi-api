spring.application.name=somi-api

# Local only for now (personal data). Remote access is milestone 4.
server.address=127.0.0.1
server.port=8080

# MCP server (Streamable HTTP at /mcp)
spring.ai.mcp.server.name=somi
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.instructions=Tools over the boss's SOMI-OS knowledge base (daily notes for now).

# Where SOMI-OS lives on this machine
somi.root=${SOMI_ROOT:${user.home}/SOMI-OS}
